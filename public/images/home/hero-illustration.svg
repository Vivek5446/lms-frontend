<svg width="480" height="420" viewBox="0 0 480 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7CFF"/>
      <stop offset="100%" stop-color="#6269FF"/>
    </linearGradient>
    <linearGradient id="bookPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bookYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="280" cy="200" rx="160" ry="140" fill="#6269FF" opacity="0.08"/>
  <ellipse cx="200" cy="260" rx="120" ry="100" fill="#8B5CF6" opacity="0.06"/>

  <!-- Plant pot -->
  <ellipse cx="130" cy="310" rx="36" ry="10" fill="#E2E8F0"/>
  <path d="M108 310 L112 268 Q130 260 148 268 L152 310 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M130 268 Q118 240 108 220 Q120 230 130 250 Z" fill="#22C55E"/>
  <path d="M130 262 Q142 232 156 212 Q144 228 136 248 Z" fill="#16A34A"/>
  <path d="M130 258 Q124 228 116 208 Q128 218 132 238 Z" fill="#4ADE80"/>

  <!-- Books stack -->
  <g filter="url(#softShadow)">
    <!-- Yellow book -->
    <rect x="200" y="268" width="180" height="28" rx="4" fill="url(#bookYellow)"/>
    <rect x="204" y="272" width="172" height="4" rx="2" fill="#FFFFFF" opacity="0.35"/>

    <!-- Purple book -->
    <rect x="188" y="236" width="196" height="32" rx="4" fill="url(#bookPurple)"/>
    <rect x="192" y="240" width="188" height="4" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <line x1="280" y1="236" x2="280" y2="268" stroke="#FFFFFF" opacity="0.2" stroke-width="2"/>

    <!-- Blue book -->
    <rect x="176" y="200" width="212" height="36" rx="4" fill="url(#bookBlue)"/>
    <rect x="180" y="204" width="204" height="5" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <line x1="282" y1="200" x2="282" y2="236" stroke="#FFFFFF" opacity="0.2" stroke-width="2"/>
  </g>

  <!-- Graduation cap -->
  <g filter="url(#softShadow)">
    <polygon points="282,148 340,176 224,176" fill="#1E293B"/>
    <rect x="268" y="172" width="28" height="48" rx="3" fill="#334155"/>
    <ellipse cx="282" cy="176" rx="58" ry="10" fill="#0F172A"/>
    <!-- Tassel -->
    <line x1="340" y1="176" x2="352" y2="210" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="352" cy="214" r="5" fill="#F59E0B"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="380" cy="120" r="4" fill="#6269FF" opacity="0.3"/>
  <circle cx="400" cy="160" r="3" fill="#8B5CF6" opacity="0.25"/>
  <circle cx="90" cy="180" r="3" fill="#6269FF" opacity="0.2"/>
  <circle cx="420" cy="280" r="5" fill="#4F7CFF" opacity="0.2"/>
</svg>
